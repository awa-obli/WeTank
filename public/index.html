<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>坦克动荡 · 局域网联机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ 首屏：开始游戏 ============ -->
<section id="view-landing" class="view">
  <button id="btn-open-settings" class="landing-settings" type="button" aria-label="打开设置">
    <svg class="landing-settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>设置
  </button>
  <div class="landing-wrap">
    <div class="brand">
      <div class="brand-badge">◪</div>
      <h1>坦克动荡</h1>
    </div>
    <p class="landing-sub">局域网联机</p>

    <label class="field nickname-field">
      <span>你的昵称</span>
      <input id="nickname" maxlength="12" placeholder="指挥官" autocomplete="off" />
    </label>

    <button id="btn-enter-rooms" class="btn btn-primary btn-start-game">开始游戏</button>

    <p id="landing-error" class="error-msg"></p>
  </div>
</section>

<!-- ============ 设置 ============ -->
<section id="view-settings" class="view hidden">
  <button id="btn-settings-back" class="settings-back" type="button">← 返回</button>
  <div class="settings-wrap">
    <header class="settings-head">
      <h1>设置</h1>
    </header>

    <div class="settings-panel settings-page-panel">
      <div class="settings-group">
        <div class="settings-group-head">
          <h2 class="settings-group-title">控制方式</h2>
          <span class="settings-group-badge">仅触屏设备显示</span>
        </div>
        <div id="control-picker" class="control-picker" role="radiogroup" aria-label="控制方式">
          <button class="control-option" type="button" data-control="joystick" role="radio" aria-checked="true">
            <span class="control-art" aria-hidden="true">◉</span>
            <span class="control-name">摇杆</span>
            <span class="control-desc">推杆指向想去的方向</span>
          </button>
          <button class="control-option" type="button" data-control="dpad" role="radio" aria-checked="false">
            <span class="control-art" aria-hidden="true">＋</span>
            <span class="control-name">十字键</span>
            <span class="control-desc">左右转向，上下前进后退</span>
          </button>
        </div>
        <p id="control-desc" class="control-desc-main">拖动摇杆指向想去的方向，坦克会自动转向；用右侧「移动/静止」切换前进或只转向。</p>
      </div>
    </div>
  </div>
</section>

<!-- ============ 房间列表 ============ -->
<section id="view-rooms" class="view hidden">
  <div class="rooms-wrap">
    <header class="rooms-header">
      <div class="rooms-heading">
        <h1>房间列表</h1>
        <p id="rooms-count" class="rooms-count">正在获取房间…</p>
      </div>
      <span id="rooms-nickname" class="nickname-chip"></span>
    </header>

    <p id="rooms-error" class="error-msg"></p>
    <div id="rooms-list" class="room-list"></div>
    <div id="rooms-empty" class="rooms-empty hidden">
      <p>暂时还没有房间</p>
      <p class="rooms-empty-hint">点击右下角「创建房间」开一局吧。</p>
    </div>
  </div>

  <div class="rooms-actions">
    <button id="btn-back-home" class="link-btn rooms-back" type="button">← 返回主页</button>
    <button id="btn-create-room" class="btn btn-primary" type="button">创建房间</button>
    <button id="btn-join-room" class="btn btn-secondary" type="button">加入房间</button>
  </div>
</section>

<!-- ============ 创建 / 加入弹窗 ============ -->
<div id="modal-create" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-create-title">
  <div class="modal-card">
    <h2 id="modal-create-title">创建房间</h2>
    <p class="modal-hint">房间名会显示在房间列表里。</p>
    <form id="form-create">
      <label class="field">
        <span>房间名</span>
        <input id="create-room-name" maxlength="20" placeholder="1–20 个字" autocomplete="off" />
      </label>
      <p id="create-error" class="error-msg"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="create">取消</button>
        <button type="submit" class="btn btn-primary">创建</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-join" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-join-title">
  <div class="modal-card">
    <h2 id="modal-join-title">加入房间</h2>
    <p class="modal-hint">输入房主分享的 4 位房间码。</p>
    <form id="form-join">
      <label class="field">
        <span>房间码</span>
        <input id="join-code" maxlength="4" placeholder="XXXX" autocomplete="off" class="code-input" />
      </label>
      <p id="join-error" class="error-msg"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="join">取消</button>
        <button type="submit" class="btn btn-secondary">加入</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- ============ 等待室 ============ -->
<section id="view-lobby" class="view hidden">
  <div class="lobby-wrap">
    <div class="lobby-grid">
      <!-- 左列：房间码 + 玩家列表 + 开始/离开按钮；按钮紧跟列表，不被右侧设置面板拉出空档 -->
      <div class="lobby-left">
        <div class="lobby-main">
          <div class="ticket">
            <span class="ticket-label">房间名</span>
            <span id="lobby-name" class="ticket-name">----</span>
            <div class="ticket-code-row">
              <span class="ticket-label">房间码</span>
              <span id="lobby-code" class="ticket-code">----</span>
            </div>
          </div>

          <div class="player-list" id="lobby-players"></div>
        </div>

        <div class="lobby-actions">
          <button id="btn-start" class="btn btn-primary" disabled>等待玩家加入…</button>
          <button id="btn-leave-lobby" class="btn btn-ghost">离开房间</button>
        </div>
      </div>

      <!-- 右列：游戏设置（模式与团队模式、胜负目标、地图类型与大小、初始血量） -->
      <aside class="lobby-side">
        <div class="settings-panel">
          <h2 class="settings-title">游戏设置</h2>
          <p class="settings-hint">仅房主可修改</p>
          <div class="settings-group">
            <span class="settings-label">游戏模式</span>
            <div id="mode-picker" class="mode-picker" role="group" aria-label="游戏模式"></div>
            <button id="btn-team-mode" class="team-mode-row" type="button" role="checkbox" aria-checked="false" aria-label="团队模式开关" disabled>
              <span class="team-mode-box" aria-hidden="true"></span>
              <span class="team-mode-name">团队模式</span>
            </button>
            <button id="btn-shuffle-teams" class="map-option team-shuffle hidden" type="button">重新分队</button>
            <p id="mode-desc" class="mode-desc"></p>
          </div>
          <div id="kill-target-group" class="settings-group hidden">
            <span id="kill-target-label" class="settings-label">击杀目标</span>
            <div class="hp-control">
              <button id="btn-kills-minus" class="hp-step" type="button" aria-label="减少击杀目标">−</button>
              <input id="kills-input" class="hp-input" type="number" inputmode="numeric" min="5" max="30" step="1" value="10" autocomplete="off" aria-label="击杀目标（5 到 30）" />
              <button id="btn-kills-plus" class="hp-step" type="button" aria-label="增加击杀目标">＋</button>
            </div>
          </div>
          <div id="capture-target-group" class="settings-group hidden">
            <span class="settings-label">占领目标</span>
            <div class="hp-control">
              <button id="btn-capture-minus" class="hp-step" type="button" aria-label="减少占领目标">−</button>
              <input id="capture-input" class="hp-input" type="number" inputmode="numeric" min="1" max="10" step="1" value="3" autocomplete="off" aria-label="占领目标（1 到 10）" />
              <button id="btn-capture-plus" class="hp-step" type="button" aria-label="增加占领目标">＋</button>
            </div>
          </div>
          <div id="collect-target-group" class="settings-group hidden">
            <span class="settings-label">收集目标</span>
            <div class="hp-control">
              <button id="btn-collect-minus" class="hp-step" type="button" aria-label="减少收集目标">−</button>
              <input id="collect-input" class="hp-input" type="number" inputmode="numeric" min="5" max="30" step="1" value="10" autocomplete="off" aria-label="收集目标（5 到 30）" />
              <button id="btn-collect-plus" class="hp-step" type="button" aria-label="增加收集目标">＋</button>
            </div>
          </div>
          <div id="win-score-group" class="settings-group hidden">
            <span class="settings-label">胜利分数</span>
            <div class="hp-control">
              <button id="btn-win-minus" class="hp-step" type="button" aria-label="减少胜利分数">−</button>
              <input id="win-score-input" class="hp-input" type="number" inputmode="numeric" min="1" max="10" step="1" value="5" autocomplete="off" aria-label="胜利分数（1 到 10）" />
              <button id="btn-win-plus" class="hp-step" type="button" aria-label="增加胜利分数">＋</button>
            </div>
          </div>
          <div class="settings-group">
            <span class="settings-label">地图类型</span>
            <div id="map-type-picker" class="map-type-picker" role="group" aria-label="地图类型"></div>
          </div>
          <div class="settings-group">
            <span class="settings-label">地图大小</span>
            <div id="map-picker" class="map-picker" role="group" aria-label="地图大小"></div>
          </div>
          <div class="settings-group">
            <span class="settings-label">初始血量</span>
            <div class="hp-control">
              <button id="btn-hp-minus" class="hp-step" type="button" aria-label="减少初始血量">−</button>
              <input id="hp-input" class="hp-input" type="number" inputmode="numeric" min="1" max="10" step="1" value="5" autocomplete="off" aria-label="初始血量（1 到 10）" />
              <button id="btn-hp-plus" class="hp-step" type="button" aria-label="增加初始血量">＋</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>

<!-- ============ 对战界面 ============ -->
<section id="view-game" class="view hidden">
  <div class="game-wrap">
    <div class="hud" id="hud-scores"></div>
    <div class="canvas-shell">
      <canvas id="game-canvas" width="960" height="640"></canvas>
      <div id="match-intro" class="match-intro hidden" role="status" aria-live="polite" aria-atomic="true">
        <span id="match-intro-mode" class="match-intro-mode"></span>
        <span class="match-intro-sep" aria-hidden="true">·</span>
        <span id="match-intro-goal" class="match-intro-goal"></span>
      </div>
      <div id="spectator-banner" class="spectator-banner hidden" role="status">观战中 · 比赛结束后自动加入</div>
      <div id="respawn-banner" class="respawn-banner hidden" role="status"></div>
      <div id="overlay-round" class="overlay hidden">
        <div class="overlay-card">
          <div id="overlay-title" class="overlay-title">回合结束</div>
          <div id="overlay-sub" class="overlay-sub"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 移动端虚拟控件：仅在触屏设备上由 JS 显示 -->
  <div id="touch-controls" class="touch-controls">
    <div id="joystick-zone" class="joystick-zone">
      <div id="joystick-stick" class="joystick-stick"></div>
    </div>
    <!-- 十字键：设置里选「十字键」后替代摇杆显示 -->
    <div id="dpad" class="dpad" role="group" aria-label="十字方向键">
      <button id="dpad-up" class="dpad-key" type="button" data-dir="forward" aria-label="前进">▲</button>
      <button id="dpad-left" class="dpad-key" type="button" data-dir="left" aria-label="左转">◀</button>
      <span class="dpad-hub" aria-hidden="true"></span>
      <button id="dpad-right" class="dpad-key" type="button" data-dir="right" aria-label="右转">▶</button>
      <button id="dpad-down" class="dpad-key" type="button" data-dir="backward" aria-label="后退">▼</button>
    </div>
    <button id="btn-move-toggle" class="btn-move-toggle active" aria-label="切换移动/静止">移动</button>
    <button id="btn-fire" class="btn-fire" aria-label="开火">开火</button>
  </div>
</section>

<script src="client.js"></script>
</body>
</html>
